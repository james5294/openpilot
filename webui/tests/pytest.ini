[pytest]
# Fork Swap WebUI Test Configuration
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test support
asyncio_mode = auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require mocks)
    security: Security-focused tests
    slow: Tests that take longer than 1 second
    asyncio: Async tests requiring event loop

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage configuration (if pytest-cov installed)
# Uncomment when ready:
# addopts = --cov=webui --cov-report=term-missing --cov-report=html

# Timeout for individual tests (requires pytest-timeout)
# timeout = 30

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging configuration
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
